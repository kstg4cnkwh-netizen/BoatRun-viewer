<!doctype html>
<html lang="en-AU">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#1a5276"/>
<title>BoatRun Live</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:none}
body{height:100dvh;width:100%;font-family:'Roboto',sans-serif;background:#efefef;overflow:hidden;
     padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
     display:flex;flex-direction:column;position:relative;--maph:45%;}

/* Top bar */
.top-bar{background:#1a5276;color:#fff;padding:10px 14px;display:flex;align-items:center;
         justify-content:space-between;flex-shrink:0;gap:8px;}
.top-title{font-size:13px;font-weight:700;letter-spacing:.12em;white-space:nowrap;}
.top-right{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end;}
.conn-pill{font-size:9px;font-weight:700;letter-spacing:.08em;padding:4px 9px;border-radius:10px;
           background:rgba(255,255,255,.18);color:rgba(255,255,255,.7);white-space:nowrap;}
.conn-pill.on{background:#27ae60;color:#fff;}
.squad-pill{font-size:9px;font-weight:700;letter-spacing:.16em;padding:4px 9px;border-radius:10px;
            background:rgba(255,255,255,.13);color:rgba(255,255,255,.9);white-space:nowrap;
            border:none;cursor:pointer;font-family:'Roboto',sans-serif;touch-action:manipulation;}
.squad-pill:active{background:rgba(255,255,255,.32);}
.add-btn{font-size:9px;font-weight:700;letter-spacing:.06em;padding:4px 9px;border-radius:10px;
         background:#27ae60;color:#fff;border:none;cursor:pointer;font-family:'Roboto',sans-serif;
         white-space:nowrap;touch-action:manipulation;}
.add-btn:active{background:#229954;}
.disc-btn{font-size:9px;font-weight:700;letter-spacing:.06em;padding:4px 9px;border-radius:10px;
          background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);border:none;cursor:pointer;
          font-family:'Roboto',sans-serif;white-space:nowrap;touch-action:manipulation;}
.disc-btn:active{background:rgba(255,255,255,.28);}

/* Split pane: map on top, tiles below, draggable divider between */
.live-scroll-area{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;}
.map-section{height:var(--maph);min-height:60px;flex-shrink:0;width:100%;}
#map{height:100%;width:100%;}
.split-handle{flex-shrink:0;height:22px;background:#dfe3e8;border-top:1px solid #c8ced6;
              border-bottom:1px solid #c8ced6;cursor:row-resize;touch-action:none;
              display:flex;align-items:center;justify-content:center;position:relative;z-index:20;}
.split-handle::before{content:'';width:46px;height:5px;border-radius:3px;background:#9aa4b0;}
.split-handle.dragging{background:#cbd3dc;}
.split-handle.dragging::before{background:#1a5276;}
.scale-ctl{position:fixed;right:10px;bottom:calc(16px + env(safe-area-inset-bottom));
           z-index:25;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;
           box-shadow:0 2px 6px rgba(0,0,0,.3);}
.scale-btn{width:44px;height:44px;background:#fff;border:none;font-size:24px;font-weight:700;
           color:#333;cursor:pointer;touch-action:manipulation;line-height:1;}
.scale-btn:first-child{border-bottom:1px solid #ddd;}
.scale-btn:active{background:#e8f0fe;}

/* Leaflet tooltip overrides */
.rower-label{background:rgba(0,0,0,.72);border:none;box-shadow:none;border-radius:3px;
             padding:2px 6px;color:#fff;font-family:'Roboto',sans-serif;font-size:10px;
             font-weight:700;letter-spacing:.06em;white-space:nowrap;}
.rower-label::before{display:none;}

/* Rower tiles — full width, wrap to new rows, scroll vertically if needed */
.rower-strip{background:#fff;padding:8px;width:100%;flex:1;min-height:0;
             overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
             display:grid;gap:8px;align-content:start;
             grid-template-columns:repeat(auto-fill,minmax(calc(168px*var(--ts)),1fr));
             --ts:1;
             padding-bottom:max(8px, env(safe-area-inset-bottom));}
.rower-card{border-radius:6px;padding:10px 13px;min-width:0;
            border-left:4px solid #27ae60;display:flex;
            flex-direction:column;gap:1px;background:#f7f8fa;
            box-shadow:0 1px 3px rgba(0,0,0,.07);}
.rower-card.stale{opacity:.45;}
.rc-move{display:flex;justify-content:flex-end;gap:3px;margin-bottom:2px;}
.rc-move-up,.rc-move-dn{width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.1);
                        color:#666;border:none;font-size:10px;line-height:20px;text-align:center;
                        cursor:pointer;touch-action:manipulation;padding:0;}
.rc-move-up:active,.rc-move-dn:active{background:rgba(0,0,0,.22);}
.rc-move-up:disabled,.rc-move-dn:disabled{opacity:.25;}
.rc-name{font-size:calc(13px*var(--ts));font-weight:700;color:#111;white-space:nowrap;
         overflow:hidden;text-overflow:ellipsis;}
.rc-metrics{display:flex;gap:calc(18px*var(--ts));margin-top:5px;}
.rc-metric{display:flex;flex-direction:column;}
.rc-val{font-family:'Roboto Condensed',sans-serif;font-size:calc(30px*var(--ts));font-weight:700;
        color:#1a5276;line-height:1.05;}
.rc-lbl{font-size:calc(9px*var(--ts));color:#aaa;letter-spacing:.08em;margin-top:1px;}
.rc-age{font-size:8px;color:#ccc;margin-top:auto;padding-top:4px;}
.empty-strip{color:#bbb;font-size:12px;padding:20px 10px;display:flex;
             align-items:center;width:100%;justify-content:center;grid-column:1/-1;}

.rc-squad{font-size:calc(8px*var(--ts));font-weight:700;letter-spacing:.14em;color:#9aa4b0;
           margin-bottom:1px;}

/* Entry overlay */
.entry-overlay{position:fixed;inset:0;background:#1a5276;display:flex;flex-direction:column;
               align-items:center;justify-content:center;z-index:1000;
               padding:30px 24px 40px;}
.entry-overlay.hidden{display:none;}
.entry-logo{font-size:10px;font-weight:700;letter-spacing:.28em;
            color:rgba(255,255,255,.45);margin-bottom:5px;}
.entry-title{font-size:26px;font-weight:700;color:#fff;letter-spacing:.1em;margin-bottom:36px;}
.entry-label{font-size:10px;font-weight:700;letter-spacing:.16em;
             color:rgba(255,255,255,.55);margin-bottom:8px;}
.entry-input{width:100%;max-width:280px;padding:15px 16px;border-radius:6px;border:2px solid transparent;
             font-family:'Roboto Condensed',sans-serif;font-size:28px;font-weight:700;
             letter-spacing:.3em;text-transform:uppercase;text-align:center;color:#1a5276;
             -webkit-appearance:none;appearance:none;outline:none;transition:border-color .15s;}
.entry-input:focus{border-color:#f39c12;}
.entry-btn{margin-top:12px;width:100%;max-width:280px;padding:16px;border-radius:6px;border:none;
           background:#27ae60;color:#fff;font-family:'Roboto',sans-serif;font-size:14px;
           font-weight:700;letter-spacing:.14em;cursor:pointer;touch-action:manipulation;}
.entry-btn:active{background:#229954;}
.entry-btn:disabled{background:#555;opacity:.5;cursor:default;}
.entry-hint{margin-top:20px;font-size:11px;color:rgba(255,255,255,.38);
            text-align:center;line-height:1.8;}
.entry-cancel{margin-top:10px;width:100%;max-width:280px;padding:13px;border-radius:6px;border:none;
              background:rgba(255,255,255,.16);color:#fff;font-family:'Roboto',sans-serif;
              font-size:12px;font-weight:700;letter-spacing:.14em;cursor:pointer;
              touch-action:manipulation;}
.entry-cancel:active{background:rgba(255,255,255,.3);}
.entry-cancel.hidden{display:none;}
</style>
</head>
<body>

<!-- Entry overlay -->
<div class="entry-overlay" id="entry-overlay">
  <div class="entry-logo">BOATRUN</div>
  <div class="entry-title" id="entry-title">LIVE VIEW</div>
  <div class="entry-label">SQUAD CODE</div>
  <input class="entry-input" id="entry-code" type="text" maxlength="7"
         placeholder="·······" autocomplete="off" autocorrect="off"
         autocapitalize="characters" spellcheck="false"/>
  <button class="entry-btn" id="entry-btn" disabled>CONNECT</button>
  <div class="entry-hint">Enter the squad code from your coach<br/>to watch the session live</div>
  <button class="entry-cancel hidden" id="entry-cancel">CANCEL</button>
</div>

<!-- Main UI (hidden until connected) -->
<div class="top-bar">
  <span class="top-title">BOATRUN LIVE</span>
  <div class="top-right">
    <span id="squad-pills" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;"></span>
    <button class="add-btn" id="add-squad-btn">+ SQUAD</button>
    <span class="conn-pill" id="conn-pill">OFFLINE</span>
    <button class="disc-btn" id="disc-btn">✕ LEAVE</button>
  </div>
</div>
<div class="live-scroll-area" id="live-scroll-area">
  <div class="map-section" id="map-section"><div id="map"></div></div>
  <div class="split-handle" id="split-handle" title="Drag to resize map"></div>
  <div class="rower-strip" id="rower-strip">
    <div class="empty-strip">Waiting for rowers…</div>
  </div>
</div>
<div class="scale-ctl" id="tile-scale-ctl">
  <button class="scale-btn" id="tile-scale-up">+</button>
  <button class="scale-btn" id="tile-scale-dn">&#8722;</button>
</div>

<script>
'use strict';
const SQUAD_DB_URL = 'https://boatrun-default-rtdb.asia-southeast1.firebasedatabase.app';
const COLORS = ['#007aff','#34c759','#ff9500','#ff3b30','#7b4bbd','#2980b9','#e67e22','#16a085','#8e44ad','#d81b60','#00897b','#5c6bc0'];
const DEMO_SQUAD_CODE = 'BOATRUN';
const DEMO_NAMES = ['Thomas', 'Richard', 'Harry', 'Larry'];
const DEMO_BASES = [
    { rate: 24, pace: 112 },
    { rate: 26, pace: 108 },
    { rate: 22, pace: 118 },
    { rate: 28, pace: 104 }
];

const fmt = s => {
    s = Math.max(0, Math.round(s));
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
};

// ── Map setup ─────────────────────────────────────────────────────────────
const _map = L.map('map', { zoomControl: true, attributionControl: false });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(_map);
_map.setView([-33.8523, 151.2108], 13); // default view — Sydney Harbour; change to your home course

let _markers  = {};   // deviceId → L.CircleMarker
let _colorMap = {};   // deviceId → color string
let _colorIdx = 0;
let _positionedIds = new Set();

function colorFor(id) {
    if (!_colorMap[id]) {
        _colorMap[id] = COLORS[_colorIdx % COLORS.length];
        _colorIdx++;
    }
    return _colorMap[id];
}

// ── Tile re-ordering (same pattern as Coach overview) ───────────────────
const TILE_ORDER_KEY = 'boatrun_viewer_tile_order';
function getTileOrder() {
    try { const v = JSON.parse(localStorage.getItem(TILE_ORDER_KEY)); return Array.isArray(v) ? v : []; } catch { return []; }
}
function saveTileOrder(arr) { try { localStorage.setItem(TILE_ORDER_KEY, JSON.stringify(arr)); } catch {} }
function orderedIds(ids) {
    const saved = getTileOrder();
    const idSet = new Set(ids);
    const kept = saved.filter(id => idSet.has(id));
    const extra = ids.filter(id => !kept.includes(id));
    return kept.concat(extra);
}
function moveTile(id, dir) {
    const ids = orderedIds(Object.keys(_rowers));
    const i = ids.indexOf(id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= ids.length) return;
    const tmp = ids[i]; ids[i] = ids[j]; ids[j] = tmp;
    saveTileOrder(ids);
    renderStrip(_rowers);
}

// ── Tile text zoom (same pattern as Coach overview) ──────────────────────
const TILE_SCALE_KEY = 'boatrun_viewer_tile_scale';
function getScale() { const v = parseFloat(localStorage.getItem(TILE_SCALE_KEY)); return (v >= 0.7 && v <= 2.0) ? v : 1; }
function setScale(v) { try { localStorage.setItem(TILE_SCALE_KEY, String(v)); } catch {} }
function applyTileScale() {
    const s = document.getElementById('rower-strip');
    if (s) s.style.setProperty('--ts', getScale());
}
function bumpScale(dir) {
    let v = getScale() + dir * 0.1;
    v = Math.round(Math.max(0.7, Math.min(2.0, v)) * 10) / 10;
    setScale(v);
    applyTileScale();
}

function updateMap(rowers) {
    const ids = Object.keys(rowers);

    Object.keys(_markers).forEach(id => {
        if (!rowers[id]) {
            _map.removeLayer(_markers[id]);
            delete _markers[id];
            _positionedIds.delete(id);
        }
    });

    const validPos = [];
    let newRower = false;
    ids.forEach(id => {
        const r = rowers[id] || {};
        if (!r.lat || !r.lon) return;
        const ll   = [r.lat, r.lon];
        const col  = colorFor(id);
        const name = r.name || 'Rower';
        if (_markers[id]) {
            _markers[id].setLatLng(ll);
        } else {
            const m = L.circleMarker(ll, {
                radius: 9, color: '#fff', weight: 2.5,
                fillColor: col, fillOpacity: 1
            }).addTo(_map);
            m.bindTooltip(name, {
                permanent: true, direction: 'top',
                offset: [0, -12], className: 'rower-label'
            });
            _markers[id] = m;
        }
        if (!_positionedIds.has(id)) { _positionedIds.add(id); newRower = true; }
        validPos.push(ll);
    });

    if (newRower) {
        if (validPos.length === 1) {
            _map.setView(validPos[0], 16);
        } else if (validPos.length > 1) {
            try { _map.fitBounds(L.latLngBounds(validPos), { padding: [44, 44], maxZoom: 17 }); } catch {}
        }
    }
}

// ── Rower strip ───────────────────────────────────────────────────────────
function renderStrip(rowers) {
    const strip = document.getElementById('rower-strip');
    const ids = orderedIds(Object.keys(rowers));
    if (!ids.length) {
        strip.innerHTML = '<div class="empty-strip">Waiting for rowers…</div>';
        return;
    }
    const now = Date.now();
    const multi = Object.keys(_squads).length > 1;
    strip.innerHTML = ids.map((id, idx) => {
        const r     = rowers[id] || {};
        const age   = r.t ? Math.round((now - r.t) / 1000) : null;
        const stale = age == null || age > 20;
        const col   = colorFor(id);
        const sq    = id.indexOf('|') > 0 ? id.split('|')[0] : '';
        return `<div class="rower-card${stale ? ' stale' : ''}" style="border-left-color:${col}">` +
            `<div class="rc-move">` +
              `<button class="rc-move-up" data-move-id="${id}" ${idx === 0 ? 'disabled' : ''}>&#9650;</button>` +
              `<button class="rc-move-dn" data-move-id="${id}" ${idx === ids.length - 1 ? 'disabled' : ''}>&#9660;</button>` +
            `</div>` +
            (multi && sq ? `<div class="rc-squad">${sq}</div>` : '') +
            `<div class="rc-name">${r.name || 'Rower'}</div>` +
            `<div class="rc-metrics">` +
              `<div class="rc-metric"><div class="rc-val">${r.rate != null ? r.rate : '--'}</div><div class="rc-lbl">SPM</div></div>` +
              `<div class="rc-metric"><div class="rc-val">${r.pace > 0 ? fmt(r.pace) : '--:--'}</div><div class="rc-lbl">/500</div></div>` +
            `</div>` +
            `<div class="rc-age">${age != null ? age + 's ago' : 'no data'}</div>` +
        `</div>`;
    }).join('');
}

// ── Firebase listener (multi-squad) ───────────────────────────────────────
let _squads = {};   // CODE -> { es, hbInt, demoTimer, on }
let _rowers = {};   // "CODE|deviceId" -> live payload

function _sendHb(code) {
    if (!code) return;
    try { fetch(SQUAD_DB_URL + '/squads/' + code + '/commands/hb.json', { method: 'PUT', body: JSON.stringify({ t: Date.now() }) }).catch(() => {}); } catch {}
}

function clearSquadRowers(code) {
    Object.keys(_rowers).forEach(k => { if (k.indexOf(code + '|') === 0) delete _rowers[k]; });
}

function startDemo(code) {
    const step = () => {
        clearSquadRowers(code);
        DEMO_BASES.forEach((b, i) => {
            const rate = b.rate + (Math.random() * 4 - 2);
            const pace = b.pace + (Math.random() * 6 - 3);
            _rowers[code + '|demo' + i] = {
                name: DEMO_NAMES[i],
                t: Date.now(),
                rate: Math.round(Math.max(16, Math.min(34, rate))),
                pace: Math.max(95, pace)
            };
        });
        renderStrip(_rowers);
        updateMap(_rowers);
    };
    step();
    _squads[code].on = true;
    setPill();
    _squads[code].demoTimer = setInterval(step, 3000);
}

// ── Squad password ────────────────────────────────────────────────────────
// Live data is read through the Worker, which checks the password server-side.
const SQUAD_WORKER = 'https://boatrun-squad.davidmacready74.workers.dev';
const SQ_PW_PREFIX = '_squad_pw_';
const _sqPwOk = {};
function getSquadPw(code) { try { return localStorage.getItem(SQ_PW_PREFIX + (code || '').toUpperCase()) || ''; } catch (e) { return ''; } }
function setSquadPw(code, pw) { try { if (pw) localStorage.setItem(SQ_PW_PREFIX + (code || '').toUpperCase(), pw); else localStorage.removeItem(SQ_PW_PREFIX + (code || '').toUpperCase()); } catch (e) {} }
function sqProxy(code, sub, extra) {
    const c = (code || '').toUpperCase();
    let u = SQUAD_WORKER + '/squad/' + c + '/' + sub + '?pw=' + encodeURIComponent(getSquadPw(c));
    if (extra) u += '&' + extra;
    return u;
}
async function checkSquadPw(code, pw) {
    const c = (code || '').toUpperCase();
    try {
        const r = await fetch(SQUAD_WORKER + '/squad/' + c + '/check?pw=' + encodeURIComponent(pw || ''));
        if (r.ok) return 'ok';
        if (r.status === 401) return 'bad';
        return 'offline';
    } catch (e) { return 'offline'; }
}
async function ensureSquadUnlocked(code) {
    const c = (code || '').toUpperCase();
    if (!c || c === DEMO_SQUAD_CODE) return true;
    if (_sqPwOk[c]) return true;
    const first = await checkSquadPw(c, getSquadPw(c));
    if (first === 'ok') { _sqPwOk[c] = true; return true; }
    if (first === 'offline') return true;
    const entered = await promptSquadPassword(c);
    if (entered === null) return false;
    const second = await checkSquadPw(c, entered);
    if (second === 'ok') { setSquadPw(c, entered); _sqPwOk[c] = true; return true; }
    alert(second === 'offline' ? 'Could not check the password \u2014 no connection.' : 'Wrong squad password.');
    return false;
}
function promptSquadPassword(code) {
    return new Promise(resolve => {
        const old = document.getElementById('_sq_pw_modal'); if (old) old.remove();
        const ov = document.createElement('div');
        ov.id = '_sq_pw_modal';
        ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:99999;padding:20px;';
        const p = document.createElement('div');
        p.style.cssText = 'background:#fff;border-radius:12px;padding:18px;width:100%;max-width:340px;font-family:-apple-system,"Roboto",sans-serif;color:#000;';
        p.innerHTML = '<div style="font-size:15px;font-weight:700;margin-bottom:6px;">SQUAD PASSWORD</div>'
            + '<div style="font-size:12px;color:#666;margin-bottom:12px;">Squad ' + code + ' is protected. Enter the password your coach set.</div>'
            + '<input id="_sq_pw_in" type="password" autocomplete="off" placeholder="Password" style="width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:15px;font-family:inherit;"/>'
            + '<div style="display:flex;gap:8px;margin-top:12px;">'
            + '<button id="_sq_pw_cancel" style="flex:1;padding:12px;border:none;border-radius:8px;background:#e5e5ea;font-size:14px;font-weight:600;font-family:inherit;">CANCEL</button>'
            + '<button id="_sq_pw_ok" style="flex:1;padding:12px;border:none;border-radius:8px;background:#1a5276;color:#fff;font-size:14px;font-weight:600;font-family:inherit;">UNLOCK</button>'
            + '</div>';
        ov.appendChild(p);
        document.body.appendChild(ov);
        const inp = document.getElementById('_sq_pw_in');
        setTimeout(() => { try { inp.focus(); } catch (e) {} }, 60);
        const done = v => { ov.remove(); resolve(v); };
        document.getElementById('_sq_pw_cancel').onclick = () => done(null);
        document.getElementById('_sq_pw_ok').onclick = () => done(inp.value || '');
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') done(inp.value || ''); if (e.key === 'Escape') done(null); });
        ov.onclick = e => { if (e.target === ov) done(null); };
    });
}
async function addSquad(code) {
    code = (code || '').trim().toUpperCase();
    if (!code) return false;
    if (_squads[code]) return true;

    if (code === DEMO_SQUAD_CODE) {
        _squads[code] = { es: null, hbInt: null, demoTimer: null, on: false };
        renderSquadPills();
        startDemo(code);
        return true;
    }

    if (!(await ensureSquadUnlocked(code))) return false;

    const S = { es: null, hbInt: null, demoTimer: null, on: false };
    _squads[code] = S;
    renderSquadPills();

    const handle = raw => {
        if (_squads[code] !== S) return;
        let msg; try { msg = JSON.parse(raw); } catch { return; }
        if (!msg) return;
        if (msg.path === '/') {
            clearSquadRowers(code);
            const snap = msg.data || {};
            Object.keys(snap).forEach(id => {
                if (snap[id] && snap[id].live) _rowers[code + '|' + id] = snap[id].live;
            });
        } else {
            const parts = msg.path.split('/').filter(Boolean);
            if (!parts.length) return;
            const key = code + '|' + parts[0];
            if (msg.data === null) {
                delete _rowers[key];
            } else if (parts.length === 1) {
                if (msg.data && msg.data.live) _rowers[key] = msg.data.live;
            } else if (parts[1] === 'live') {
                _rowers[key] = msg.data;
            }
        }
        renderStrip(_rowers);
        updateMap(_rowers);
    };

    S.es = new EventSource(sqProxy(code, 'rowers', 'stream=1'));
    S.es.addEventListener('put',   e => handle(e.data));
    S.es.addEventListener('patch', e => handle(e.data));
    S.es.onopen  = () => { S.on = true;  setPill(); };
    S.es.onerror = () => { S.on = false; setPill(); };

    _sendHb(code);
    S.hbInt = setInterval(() => _sendHb(code), 25000);
    setPill();
    return true;
}

function removeSquad(code) {
    const S = _squads[code];
    if (!S) return;
    if (S.es) { try { S.es.close(); } catch (e) {} }
    if (S.hbInt) clearInterval(S.hbInt);
    if (S.demoTimer) clearInterval(S.demoTimer);
    delete _squads[code];

    Object.keys(_rowers).forEach(k => {
        if (k.indexOf(code + '|') === 0) {
            delete _rowers[k];
            if (_markers[k]) { try { _map.removeLayer(_markers[k]); } catch (e) {} delete _markers[k]; }
            _positionedIds.delete(k);
            delete _colorMap[k];
        }
    });

    renderSquadPills();
    setPill();
    renderStrip(_rowers);
    updateMap(_rowers);
    if (!Object.keys(_squads).length) openEntry(false);
}

function disconnect() {
    Object.keys(_squads).forEach(c => {
        const S = _squads[c];
        if (S.es) { try { S.es.close(); } catch (e) {} }
        if (S.hbInt) clearInterval(S.hbInt);
        if (S.demoTimer) clearInterval(S.demoTimer);
    });
    _squads   = {};
    _rowers   = {};
    _colorMap = {};
    _colorIdx = 0;
    _positionedIds.clear();
    Object.keys(_markers).forEach(id => { try { _map.removeLayer(_markers[id]); } catch (e) {} delete _markers[id]; });
    renderSquadPills();
    setPill();
    renderStrip({});
}

function renderSquadPills() {
    const box = document.getElementById('squad-pills');
    if (!box) return;
    const codes = Object.keys(_squads);
    box.innerHTML = codes.map(c =>
        `<button class="squad-pill" data-squad="${c}">${c} &#10005;</button>`
    ).join('');
}

function setPill() {
    const p = document.getElementById('conn-pill');
    const codes = Object.keys(_squads);
    const on = codes.some(c => _squads[c].on);
    p.textContent = on ? 'CONNECTED' : 'OFFLINE';
    p.classList.toggle('on', on);
}

// ── UI wiring ─────────────────────────────────────────────────────────────
function validEntryCodeLen(code) { return code.length === 7 || code === DEMO_SQUAD_CODE; }

function openEntry(addMode) {
    const ov = document.getElementById('entry-overlay');
    document.getElementById('entry-title').textContent = addMode ? 'ADD SQUAD' : 'LIVE VIEW';
    document.getElementById('entry-cancel').classList.toggle('hidden', !addMode);
    document.getElementById('entry-code').value = '';
    document.getElementById('entry-btn').disabled = true;
    document.getElementById('entry-btn').textContent = addMode ? 'ADD' : 'CONNECT';
    ov.classList.remove('hidden');
    setTimeout(() => { try { document.getElementById('entry-code').focus(); } catch (e) {} }, 80);
}

document.getElementById('entry-btn').addEventListener('click', async () => {
    const btn  = document.getElementById('entry-btn');
    const code = (document.getElementById('entry-code').value || '').trim().toUpperCase();
    if (!validEntryCodeLen(code)) return;
    btn.disabled = true;
    const ok = await addSquad(code);
    if (ok) {
        document.getElementById('entry-code').value = '';
        document.getElementById('entry-overlay').classList.add('hidden');
        try { _map.invalidateSize(); } catch (e) {}
    } else {
        btn.disabled = false;
    }
});

document.getElementById('entry-code').addEventListener('input', () => {
    const code = (document.getElementById('entry-code').value || '').trim().toUpperCase();
    document.getElementById('entry-btn').disabled = !validEntryCodeLen(code);
});

document.getElementById('entry-code').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('entry-btn').click();
});

document.getElementById('entry-cancel').addEventListener('click', () => {
    document.getElementById('entry-overlay').classList.add('hidden');
});

document.getElementById('add-squad-btn').addEventListener('click', () => openEntry(true));

document.getElementById('squad-pills').addEventListener('click', e => {
    const b = e.target.closest('.squad-pill[data-squad]');
    if (!b) return;
    removeSquad(b.dataset.squad);
});

document.getElementById('disc-btn').addEventListener('click', () => {
    disconnect();
    openEntry(false);
});
document.getElementById('rower-strip').addEventListener('click', e => {
    const up = e.target.closest('.rc-move-up[data-move-id]');
    if (up) { moveTile(up.dataset.moveId, -1); return; }
    const dn = e.target.closest('.rc-move-dn[data-move-id]');
    if (dn) { moveTile(dn.dataset.moveId, 1); return; }
});

// ── Draggable map / tiles divider ────────────────────────────────────────
const MAP_H_KEY = 'boatrun_viewer_map_height';
function applyMapHeight(px) {
    const area = document.getElementById('live-scroll-area');
    if (!area) return;
    const max = Math.max(80, area.clientHeight - 120);
    const v = Math.round(Math.max(60, Math.min(max, px)));
    document.body.style.setProperty('--maph', v + 'px');
    try { _map.invalidateSize(); } catch (e) {}
    return v;
}
(function initSplit() {
    const handle = document.getElementById('split-handle');
    const area   = document.getElementById('live-scroll-area');
    const sect   = document.getElementById('map-section');
    if (!handle || !area || !sect) return;

    const saved = parseFloat(localStorage.getItem(MAP_H_KEY));
    setTimeout(() => {
        applyMapHeight(saved > 0 ? saved : area.clientHeight * 0.45);
    }, 60);

    let dragging = false;
    const onMove = e => {
        if (!dragging) return;
        e.preventDefault();
        const y = (e.touches ? e.touches[0].clientY : e.clientY);
        applyMapHeight(y - area.getBoundingClientRect().top);
    };
    const onUp = () => {
        if (!dragging) return;
        dragging = false;
        handle.classList.remove('dragging');
        try { localStorage.setItem(MAP_H_KEY, String(sect.clientHeight)); } catch (e) {}
        try { _map.invalidateSize(); } catch (e) {}
    };
    const onDown = e => {
        dragging = true;
        handle.classList.add('dragging');
        if (e.cancelable) e.preventDefault();
    };
    handle.addEventListener('mousedown', onDown);
    handle.addEventListener('touchstart', onDown, { passive: false });
    document.addEventListener('mousemove', onMove);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchend', onUp);
    document.addEventListener('touchcancel', onUp);
    window.addEventListener('resize', () => {
        const cur = parseFloat(localStorage.getItem(MAP_H_KEY));
        applyMapHeight(cur > 0 ? cur : area.clientHeight * 0.45);
    });
})();

const _tsUp = document.getElementById('tile-scale-up');
const _tsDn = document.getElementById('tile-scale-dn');
if (_tsUp) _tsUp.addEventListener('click', () => bumpScale(1));
if (_tsDn) _tsDn.addEventListener('click', () => bumpScale(-1));
applyTileScale();

// ── Age ticker ────────────────────────────────────────────────────────────
setInterval(() => { if (Object.keys(_rowers).length) renderStrip(_rowers); }, 2000);

// ── Map resize guard ──────────────────────────────────────────────────────
new ResizeObserver(() => _map.invalidateSize()).observe(document.getElementById('map'));
setTimeout(() => { try { _map.invalidateSize(); } catch (e) {} }, 300);
setTimeout(() => { try { _map.invalidateSize(); } catch (e) {} }, 1000);
(async function () {
    const params = new URLSearchParams(window.location.search);
    const raw = (params.get('code') || '').trim().toUpperCase();
    if (raw.length >= 3) {
        const codes = raw.split(/[,+ ]+/).filter(c => c.length >= 3);
        document.getElementById('entry-overlay').classList.add('hidden');
        let any = false;
        for (const c of codes) { if (await addSquad(c)) any = true; }
        if (!any) openEntry(false);
    }
})();
</script>
